<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>أداة التشفير | AES-256</title>
<style>
:root{--bg:#0b1220;--cd:#162033;--tx:#e5e7eb;--mu:#94a3b8;--bd:#2a3a55;--ac:#22c55e;--bad:#ef4444}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,sans-serif;display:flex;justify-content:center;padding:20px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:22px;width:100%;max-width:460px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--mu);font-size:13px;margin:0 0 16px}
label{display:block;font-size:14px;margin:12px 0 6px}
textarea,input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:15px;font-family:inherit}
textarea{min-height:110px;resize:vertical}
.row{display:flex;gap:8px;margin-top:14px}
button{flex:1;padding:12px;border:0;border-radius:10px;font-size:15px;font-weight:bold;font-family:inherit;color:#fff}
#en{background:var(--ac);color:#052e16}
#de{background:#3b82f6}
#out{margin-top:16px;padding:12px;border-radius:10px;background:var(--bg);border:1px dashed var(--bd);font-family:monospace;font-size:13px;word-break:break-all;min-height:48px}
#out.err{color:var(--bad)}
#cp{background:#475569;margin-top:10px;display:none;width:100%}
.note{color:var(--mu);font-size:12px;margin-top:14px;line-height:1.6}
#kw{display:flex;gap:8px}
#sh{flex:none;width:52px;background:#475569;padding:0}
.bar{height:8px;background:var(--bd);border-radius:6px;margin-top:8px;overflow:hidden}
#fl{height:100%;width:0;transition:.3s}
#lv{font-size:13px;margin-top:4px;min-height:20px}
</style>
</head>
<body>
<div class="card">
  <h1>🔒 أداة التشفير</h1>
  <p class="sub">شفّر نصوصك بـ AES-256 بدون ما تطلع من جهازك</p>

  <label for="tx">النص (أو النص المشفّر لفك التشفير)</label>
  <textarea id="tx" placeholder="اكتب أو الصق النص هون"></textarea>

  <label for="kk">كلمة السر</label>
  <div id="kw"><input id="kk" type="password" placeholder="كلمة سر قوية"><button id="sh" type="button">👁</button></div>
  <div class="bar"><div id="fl"></div></div>
  <div id="lv"></div>

  <div class="row">
    <button id="en">🔐 شفّر</button>
    <button id="de">🔓 فك التشفير</button>
  </div>

  <div id="out">النتيجة بتظهر هون</div>
  <button id="cp">نسخ النتيجة</button>

  <p class="note">التشفير: AES-256-GCM، واشتقاق المفتاح: PBKDF2 بـ 150 ألف تكرار مع salt عشوائي. كل شي بيصير داخل المتصفح، ولا يُرسَل أي شي لأي سيرفر.</p>
</div>
<script>
const $=id=>document.getElementById(id);
const enc=new TextEncoder(),dec=new TextDecoder();
const toB64=u=>btoa(String.fromCharCode(...u));
const fromB64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function getKey(pw,salt){
 const m=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
function show(t,err){$('out').textContent=t;$('out').className=err?'err':'';$('cp').style.display=err?'none':'block'}
$('en').onclick=async()=>{
 if(!$('tx').value||!$('kk').value){show('اكتب النص وكلمة السر',true);return}
 try{
  const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const key=await getKey($('kk').value,salt);
  const c=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,enc.encode($('tx').value)));
  const all=new Uint8Array(28+c.length);all.set(salt);all.set(iv,16);all.set(c,28);
  show(toB64(all));
 }catch(e){show('صار خطأ بالتشفير',true)}
};
$('de').onclick=async()=>{
 if(!$('tx').value||!$('kk').value){show('الصق النص المشفّر وكلمة السر',true);return}
 try{
  const a=fromB64($('tx').value.trim());
  const key=await getKey($('kk').value,a.slice(0,16));
  const p=await crypto.subtle.decrypt({name:'AES-GCM',iv:a.slice(16,28)},key,a.slice(28));
  show(dec.decode(p));
 }catch(e){show('❌ كلمة السر غلط أو النص تالف',true)}
};
$('sh').onclick=()=>{$('kk').type=$('kk').type==='password'?'text':'password'};
$('kk').oninput=()=>{
 const v=$('kk').value;
 if(!v){$('fl').style.width='0';$('lv').textContent='';return}
 const p=(/[a-z]/.test(v)?26:0)+(/[A-Z]/.test(v)?26:0)+(/[0-9]/.test(v)?10:0)+(/[^A-Za-z0-9]/.test(v)?32:0);
 const b=v.length*Math.log2(p||1);
 const l=b<28?['ضعيفة جداً','#ef4444',15]:b<40?['ضعيفة','#f97316',35]:b<60?['متوسطة','#eab308',60]:b<80?['قوية','#84cc16',85]:['قوية جداً','#22c55e',100];
 $('fl').style.width=l[2]+'%';$('fl').style.background=l[1];
 $('lv').textContent='قوة كلمة السر: '+l[0];$('lv').style.color=l[1];
};
$('cp').onclick=async()=>{
 try{await navigator.clipboard.writeText($('out').textContent);
 $('cp').textContent='تم النسخ ✓';setTimeout(()=>$('cp').textContent='نسخ النتيجة',1500)}catch(e){}
};
</script>
</body>
</html>
